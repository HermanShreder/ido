ps://www.googletagmanager.com/ns.html?id=GTM-K43K2ZQ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><div id="__next"><h1 class="visually-hidden">Datai Network (DATAI) IDO: Early Access Token Sale</h1><div></div><div class="Toastify"></div><style data-emotion="css 1k371a6">@media print{.css-1k371a6{position:absolute!important;}}</style></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"title":"Datai Network (DATAI) IDO: Early Access Token Sale | ChainGPT Pad","image":"https://chaingpt-launchpad.s3.us-east-2.amazonaws.com/images/ido/Cover%20Image%20-%20DN.jpeg","shortDescription":"Join the Datai Network IDO on ChainGPT Pad. Get early access to DATAI tokens before public listing. Secure your allocation in this innovative Web3 project. Sale dates: –.","ogTitle":"🚀 Datai Network (DATAI) IDO: Early Access Token Sale","ogDescription":"Get early access to $DATAI tokens in the Datai Network IDO on ChainGPT Pad. Secure your allocation before public listing. Sale dates: –.","twitterTitle":"🚀 Datai Network (DATAI) IDO: Early Access Token Sale","twitterDescription":"Join the Datai Network IDO on ChainGPT Pad. Get early access to DATAI tokens before public listing. Sale dates: –.","canonicalUrl":"https://pad.chaingpt.org/pools/datai-network","website":"www.datai.network","poolData":{"id":168,"title":"Datai Network","website":"www.datai.network","banner":"https://chaingpt-launchpad.s3.us-east-2.amazonaws.com/images/ido/Cover%20Image%20-%20DN.jpeg","relationship_type":"IDO (Labs Incubation)","updated_at":"2026-09-30 19:40:01","created_at":"2024-10-21 07:57:12","campaign_hash":null,"campaign_claim_hash":null,"campaign_id":null,"short_description":"Transforming Blockchain data into Insights","description":"\u003cp\u003e\u003cimg src=\"https://chaingpt-launchpad.s3.us-east-2.amazonaws.com/images/ido/Cover%20Image%20-%20DN.jpeg\" alt=\"\" width=\"95%\" height=\"95%\"\u003e\u003c/p\u003e\n\u003ch3 dir=\"ltr\"\u003e\u003cstrong\u003eThe Problem:\u003c/strong\u003e\u003c/h3\u003e\n\u003cp dir=\"ltr\"\u003eBlockchain was designed to be transparent, but its success has led to an overwhelming amount of data, making it inaccessible and unusable to the average user. Although blockchain data is publicly available, it lacks context, making it hard to extract insights. Data processing and contextual analysis are needed to make sense of the data. We are making blockchain data transparent again by simplifying it and making it insightful and actionable.\u003c/p\u003e\n\u003ch3 dir=\"ltr\"\u003e\u003cstrong\u003eOur Solution:\u003c/strong\u003e\u003c/h3\u003e\n\u003cp dir=\"ltr\"\u003eDatai Network empowers the community to unlock deeper insights from on-chain activity, enabling data-driven decisions. Datai Network transforms raw blockchain data into actionable insights for individuals, businesses, and governments. By simplifying blockchain data, it makes it more accessible and understandable, empowering data-driven decisions that unlock the potential of Web3. Datai Network is bridging the gap between the missing data today \u0026amp; contextual analysis needed in blockchain data to provide usable, actionable information of high value to anyone in the blockchain ecosystem. \u003cbr\u003e\u003cbr\u003eHere's how Datai Network is transforming blockchain data and analytics:\u0026nbsp;\u003c/p\u003e\n\u003cul\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eOmni-Chain Data Layer\u003c/strong\u003e: Datai Network offers cross-chain analytics through a decentralized, infinitely scalable data infrastructure. Currently supporting 20+ blockchains, Datai enables comprehensive user insights with continuously expanding coverage. .\u0026nbsp;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eAdvanced On-Chain Analytics\u003c/strong\u003e: Datai's platform provides in-depth insights to chains, DApps, compliance \u0026amp; AML players, and financial institutions by delivering automatically labeled data on smart contracts, DeFi protocols, NFTs, \u0026amp; more. It allows businesses to gain a better understanding of their users, provides complementary data to compliance processes, and enhances marketing strategies through accurate, actionable insights.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eTokenomics and Decentralization\u003c/strong\u003e: Utilizing the Datai token (ERC-20), Datai's ecosystem incentivizes data integration and usage, promoting community-driven contributions and offering a decentralized solution to blockchain data analysis.\u0026nbsp;\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 dir=\"ltr\"\u003e\u003cbr\u003eOur Vision:\u0026nbsp;\u003c/h3\u003e\n\u003cp dir=\"ltr\"\u003eWe envision a world where data and insights on-chain are readily available \u0026amp; consumable as they are today in Web2. To achieve this, we aggregate, index, analyze, and serve all blockchain history, making it simple, understandable, and accessible for any use by any developer, researcher, or user.\u003c/p\u003e\n\u003ch3 dir=\"ltr\"\u003eOur Mission:\u003c/h3\u003e\n\u003cp dir=\"ltr\"\u003eOur mission is to empower Web3 participants to make data-driven analyses and decisions by providing deep insights into on-chain activity and user behavior, thereby accelerating the adoption and growth of Web3.\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003e\u003cimg src=\"https://chaingpt-launchpad.s3.us-east-2.amazonaws.com/images/ido/Problem%20Transaparency%20Paradox%20-%20DN.png\" alt=\"\" width=\"95%\" height=\"95%\"\u003e\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003eDatai is building a decentralized network to transform blockchain data into actionable insights with an ever expanding data coverage, and with the aim to get complete insights. It uses a community-led approach to eliminate the risks of dependencies. Through Datai Network\u0026rsquo;s web portal, developers, indexers, and data providers can join the network, and become active contributors to the network, or customers of it.\u0026nbsp;\u003c/p\u003e\n\u003cul\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eDeveloper Hub\u003c/strong\u003e: Developers can access tools, SDKs, and APIs to add integrations, build, and contribute new data sources to the network. The hub allows developers to create custom applications that leverage Datai\u0026rsquo;s on-chain analytics and insights.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eIndexer Portal\u003c/strong\u003e: Indexers play an important role in expanding the data coverage. Indexers can contribute to indexing new blockchains and datasets, earning rewards via the Datai token for their contributions to the network\u0026rsquo;s growth and decentralization.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eData Consumer Dashboard\u003c/strong\u003e: Data consumers, including DApps, businesses, and financial institutions, can access, request, and pay for\u0026nbsp; blockchain data and analytics. This interface provides customizable dashboards to track on-chain data, user insights, transaction flows, and more.\u0026nbsp;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eToken-Driven Economy\u003c/strong\u003e: The portal allows contributors to earn and use Datai tokens as part of a decentralized, incentive-based ecosystem. Developers, indexers, and consumers are all rewarded for their participation, promoting active involvement and network decentralization.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eCollaborative Environment:\u003c/strong\u003e The web portal acts as a community hub where users can share feedback, best practices, and collaborate together.\u0026nbsp;\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp dir=\"ltr\"\u003eDatai Network is also building solutions that go an extra mile to provide specific, relevant insights to various use cases and businesses including crypto accounting, tax, funds, compliance, marketing, chains, DApps \u0026amp; more.\u0026nbsp;\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003e\u003cstrong\u003eDiscover Datai\u0026rsquo;s current solutions, built on top of the network\u0026rsquo;s data:\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003e\u003cstrong\u003e1. Datai User Insights\u003c/strong\u003e: This solution provides advanced analytics on user on-chain activity, offering insights into behavior, interests, and engagement patterns. It helps DApps, businesses, and marketers personalize user experiences, craft data-driven marketing strategies, and make more informed decisions based on real-time blockchain data.\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003e\u003cstrong\u003e2. Datai Financial Data\u003c/strong\u003e: Focused on financial institutions, this solution delivers in-depth DeFi analytics regarding current and historical positions.\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003e\u003cstrong\u003e3. Datai Transaction Insights\u003c/strong\u003e: This solution offers enhanced visibility into on-chain transaction activity, providing detailed tracking and filtering of transaction flows across multiple blockchains. It's particularly useful for compliance and AML teams, assisting with investigations and crypto accountant, enabling better understanding of wallet complexities for better pricing.\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003e\u003cstrong\u003e4. Datai Chain Insights\u003c/strong\u003e: This solution offers comprehensive data and analytics across multiple blockchains, giving users a clear view of the ecosystem\u0026rsquo;s broader trends and patterns. It\u0026rsquo;s designed to help businesses, developers, and investors track blockchain performance, network activity, and protocol-level insights to inform strategic decisions and optimize blockchain-related\u0026nbsp;\u003c/p\u003e","roadmap":"\u003cp\u003e\u003cimg src=\"https://chaingpt-launchpad.s3.us-east-2.amazonaws.com/images/ido/Roadmap%20-%20Updated%20-%20DN.png\" alt=\"\" width=\"95%\" height=\"95%\"\u003e\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003e\u003cstrong\u003eKey highlights:\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eHigh Blockchain Coverage\u003c/strong\u003e: Datai Network supports 20+ chains, including EVMs and non-EVMs, with an aim to enhance interoperability across diverse ecosystems.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eDecentralized Data Infrastructure\u003c/strong\u003e: Through its decentralized network, Datai Network provides scalable, reliable, and accessible data solutions, minimizing the risks of reliance on centralized entities.\u0026nbsp;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eVarious Customer Centric Solutions\u003c/strong\u003e: On top of its network, Datai has also built its own customer facing solutions for a wide range of users, from DeFi funds \u0026amp; crypto accountants to chains \u0026amp; DApps.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eTransformative Data for DApps\u003c/strong\u003e: With advanced on-chain user behavior analytics, Datai allows DApps to optimize their own users\u0026rsquo; experiences, analyze competition, and shape marketing efforts for increased engagement.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli dir=\"ltr\" aria-level=\"1\"\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eEnhanced Data for Accounting \u0026amp; Tax\u003c/strong\u003e: By automating the identification \u0026amp; labeling of smart contracts \u0026amp; transactions, Datai simplifies accounting and tax processes in crypto, improving transaction tracking for crypto assets.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003eDatai Network is reshaping blockchain data analytics, bridging the gap between indexed blockchain data and practical, real-world applications through a decentralized, community-led and community-powered model.\u003c/p\u003e\n\u003cp\u003e\u003cstrong id=\"docs-internal-guid-f646eee6-7fff-65b8-e159-5afa721c5680\"\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e","business_model":"\u003cp dir=\"ltr\"\u003eOn the Network level, Datai generates revenues from its current and expanding customer base that will be redirected onto the network. It also generates a Network Tax from Data consumers who will pay the network for their data requests.\u0026nbsp;\u003c/p\u003e\n\u003cp dir=\"ltr\"\u003eOn the application level, just like any other DApp that can come and build on Datai Network and generate its own revenues, Datai is already ahead with 4 Solutions that have customers and products generating revenues on a monthly basis.\u0026nbsp;\u003c/p\u003e","team":"\u003ch3 dir=\"ltr\"\u003eLeadership Team:\u0026nbsp;\u003c/h3\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003e\u003cstrong\u003eElie Azzi, Co-Founder \u0026amp; CEO (\u003ca href=\"https://www.linkedin.com/in/elie-azzi-02820378/\"\u003eLinkedIn)\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eElie entered the blockchain space in 2016 as one of the first blockchain engineers at BNP Paribas. In 2019, he founded a debt tokenization platform on Corda at R3. Before launching Datai Network, Elie created Merlin, a Web3 data provider for DeFi analytics. A Software Engineering graduate from IMT Atlantique, he specializes in decentralized networks, DeFi, and machine learning.\u003c/p\u003e\n\u003cp\u003e\u003cstrong id=\"docs-internal-guid-fba4d2f6-7fff-a7cb-c9f5-502f8c294d04\"\u003eMaria Mounayar, Co-Founder \u0026amp; COO (\u003cstrong id=\"docs-internal-guid-d945a66f-7fff-dc62-bd85-b16233cb4188\"\u003e\u003ca href=\"https://www.linkedin.com/in/mariamounayar/\"\u003eLinkedIn\u003c/a\u003e)\u003c/strong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp dir=\"ltr\" role=\"presentation\"\u003eMaria's career spans engineering, marketing, and data analysis, including 6+ years at Amazon. She was the former Enterprise Marketing Manager at AWS France. She has a strong background in B2C and B2B tech marketing, and officially entered the Web3 space with her role at Merlin, a leading Web3 data provider. Maria holds both engineering and business qualifications, bringing a technical and strategic vision to her work.\u003c/p\u003e\n\u003cp\u003e\u003cstrong id=\"docs-internal-guid-9ade2d66-7fff-25df-8d55-c36ff51da094\"\u003eVinson Leow, Co-Founder \u0026amp; CSO (\u003cstrong id=\"docs-internal-guid-e3199310-7fff-42c0-ea1d-6c6695f9c071\"\u003e\u003ca href=\"https://www.linkedin.com/in/vinsonleow/\"\u003eLinkedIn\u003c/a\u003e)\u003c/strong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eVinson has been deeply immersed in Web3 since 2016, driving project growth as Head of Growth at Partisia and the key contributor to a $55.5M raise. A growth hacker and serial entrepreneur, he has exited multiple ventures, invested into 100+ Web3 startups and raised over $15M through crowdfunding for his brand Chargeasap. Vinson mentors at Techstars and combines his commerce background with hands-on experience to drive Web3 innovation.\u003c/p\u003e\n\u003cp\u003e\u003cstrong id=\"docs-internal-guid-694f16b3-7fff-8bca-2bd9-ca71fbb3c49e\"\u003eAnton Germashev, CTO (\u003cstrong id=\"docs-internal-guid-92dd3b8c-7fff-a442-86c6-2dc7e3d8aa67\"\u003e\u003ca href=\"https://www.linkedin.com/in/anton-germashev-phd-ab3641130/\"\u003eLinkedIn\u003c/a\u003e)\u003c/strong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAnton is a CTO and lead developer with over 10 years of experience, delivering innovative solutions for enterprise projects and startups. His expertise spans Web2 and Web3 technologies with a focus on blockchain and distributed ledger technologies (DLT). With a Ph.D. in Engineering and the title of Vice Professor, he combines theoretical insights with practical applications to drive forward-thinking strategies in technology.\u003c/p\u003e","partners_investors":"\u003cp\u003e\u003cimg src=\"https://chaingpt-launchpad.s3.us-east-2.amazonaws.com/images/ido/Customers%20%26%20Partners%20-%20DN.jpeg\" alt=\"\" width=\"95%\" height=\"95%\"\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli dir=\"ltr\"\u003eChainGPT Labs\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eBig Brain Holdings\u0026nbsp;\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eShima Capital\u0026nbsp;\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eR3\u0026nbsp;\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eSix\u0026nbsp;\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eBlizzard\u0026nbsp;\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eGSR\u0026nbsp;\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eAva Labs\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eMetavallon\u0026nbsp;\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eRepublic Crypto\u0026nbsp;\u003c/li\u003e\n\u003cli dir=\"ltr\"\u003eLedger\u003c/li\u003e\n\u003c/ul\u003e","token_metrics":"\u003cp\u003e\u003cimg src=\"https://chaingpt-launchpad.s3.us-east-2.amazonaws.com/images/ido/Token%20Utility%20-%20DN.png\" alt=\"\" width=\"95%\" height=\"95%\"\
